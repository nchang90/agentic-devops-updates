<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Agentic DevOps Updates</title>
  <style>
    :root { color-scheme: dark; --bg: #0b1020; --card: #151d33; --text: #f4f7ff; --muted: #aab6d3; --accent: #79b8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #1b3158, var(--bg) 55%); color: var(--text); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(760px, 100%); padding: 48px; background: color-mix(in srgb, var(--card) 92%, transparent); border: 1px solid #2b3b60; border-radius: 24px; box-shadow: 0 24px 80px #0008; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 700 .78rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: clamp(2.2rem, 7vw, 4.5rem); line-height: 1; letter-spacing: -.05em; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 700; }
    .links { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 28px; }
  </style>
</head>

  </main>
