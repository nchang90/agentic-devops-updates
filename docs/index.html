<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic DevOps Updates</title>
  <style>
    :root { color-scheme: light; --bg: #f6f8fa; --card: #fff; --text: #1f2328; --muted: #59636e; --accent: #0969da; --border: #d1d9e0; }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0d1117; --card: #161b22; --text: #f0f6fc; --muted: #8b949e; --accent: #58a6ff; --border: #30363d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, color-mix(in srgb, var(--accent) 18%, var(--bg)), var(--bg) 55%); color: var(--text); font: 16px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(760px, 100%); padding: 48px; background: var(--card); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 24px 80px #0002; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font: 700 .78rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: clamp(2.2rem, 7vw, 4.5rem); line-height: 1; letter-spacing: -.05em; }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 700; }
    .links { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 28px; }
    .theme-toggle { position: fixed; top: 16px; right: 16px; z-index: 10; font: 600 .78rem ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text); border-radius: 999px; padding: 8px 14px; }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">Dark mode</button>
  <main>
    <p class="eyebrow">Platform engineering watchlist</p>
    <h1>Agentic DevOps Updates</h1>
    <p>Tracking Azure SRE Agent, Azure Monitor Observability Agent, resiliency capabilities, coding agents, and related platform engineering announcements.</p>
    <div class="links">
      <a href="copilot-app-releases.html">GitHub Copilot Updates →</a>
      <a href="agentic-devops-releases.html">Azure &amp; DevOps digest →</a>
    </div>
  </main>
  <script>
    (function () {
      var key = "agentic-devops-theme";
      var button = document.getElementById("theme-toggle");
      var saved = localStorage.getItem(key);
      var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      function apply(next) {
        document.documentElement.dataset.theme = next;
        var dark = next === "dark";
        button.setAttribute("aria-pressed", String(dark));
        button.textContent = dark ? "Light mode" : "Dark mode";
      }
      apply(theme);
      button.addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        localStorage.setItem(key, next);
        apply(next);
      });
    })();
  </script>
</body>
</html>
